# astro-sveltia-pages i18n template v__TEMPLATE_VERSION__
# .github/workflows/i18n-translate.yml
#
# 来源: astro-sveltia-pages —— i18n 自动翻译工作流模板。
# 由 `astro-sveltia-pages init:i18n` 生成，项目专有路径已自动填充。
#
# ⚠️ 升级 astro-sveltia-pages 后必须重新运行 `pnpm exec astro-sveltia-pages init:i18n`
#    （CLI 会自动检测旧版模板并升级，同时备份原文件）。只升级依赖不会更新本文件。
#    0.3.6 起 detect 阶段会在 CI 内把本模板版本与 lockfile / package.json 中
#    实际安装的包版本比对，不一致立即失败并给出修复命令；不再只依赖本地
#    `astro dev` / `astro build` 的告警（CMS 直接 push 的用户根本看不到它）。
#
# 方案: 复用 pelikhan/action-continuous-translation@v0.2.11 作为翻译引擎（DeepSeek 驱动）。
#
# 目标: Sveltia CMS 编辑只维护英文源文件；本工作流在 EN 源变更时，
#       增量翻译为目标语言，并"自检通过后直接发布到 main"（无需 CMS 二次操作）。
#       通过 env.PUBLISH_MODE 可切换为开 PR 待人工合并。
#
# ⚠️ 已知坑（务必遵守，否则整次 push 的工作流 / CF 部署都会被跳过）：
#   提交信息里绝不能出现 CI 跳过标记：如 [skip ci] / [ci skip] / skip-checks 等
#   被方括号包裹的 skip ci / ci skip 写法。Sveltia 的 backend 也不能配置 skip_ci:true。
#
# ── 接入说明 ───────────────────────────────────────────────────────────
# 1) Sveltia 侧（关键，CMS 配置里必须做）：
#      i18n:
#        structure: __I18N_STRUCTURE__
#        default_locale: en
#      每个"需要 CI 翻译"的集合必须设：
#        i18n: { save_all_locales: false, initial_locales: ["en"] }
#      ← 让 CMS 只提交 en 文件，CI 负责其余语言（否则会一次生成一堆空壳译文）。
#      把 slug / 图片路径等"不可翻译字段"标记为 `i18n: duplicate`，
#      它们会被原样复制、永不被送翻。
# 2) 不触发翻译：单篇在 frontmatter 设 `autoTranslate: false`；
#    全局暂停：把本文件 env.AUTO_TRANSLATE 改为 "false"。
#    自动排除：草稿（frontmatter draft:true）、模板文件（_template.md / templates 目录）
#    在检测阶段即跳过（这些条目仍以英文发布，只是不送翻）。
# 3) 存量站引导：已存在的 EN 文件不会自动翻译。到 Actions → i18n-translate →
#    Run workflow，勾选 force 并填 scope（如 posts）分批翻译；中断重跑会增量续翻已有译文。
#
# ── API 凭证（仓库 Settings → Secrets and variables → Actions → New repository secret）──
#   默认走 DeepSeek（OpenAI 兼容端点）：
#     • DEEPSEEK_API_KEY —— DeepSeek API Key（sk- 开头）。
#        申请：platform.deepseek.com → API Keys → Create new API key，复制后立即保存（只显示一次）。
#        填到：本文件翻译步骤的 secrets.DEEPSEEK_API_KEY（端点 https://api.deepseek.com 已写死）。
#     • 模型 deepseek-flash 为当前官方名；0.3.4 用的旧版 flash 别名已退役，不要再用。
# ───────────────────────────────────────────────────────────────────

name: i18n-translate

# 引号包裹 `on` 以兼容标准 YAML 解析器（裸 `on:` 在 YAML 1.1 会被视为布尔值）。
"on":
    # 只监听"需要翻译的集合"的英文源文件（本模板由 init:i18n 填入对应集合）；
    # 译文文件不会再次触发，天然避免回环。
    push:
        branches: [main]
        paths:
            - "__COLLECTION_EN_PATH__"
    workflow_dispatch:
        inputs:
            force:
                description: "绕过增量，强制全量翻译（用于存量站批量引导）"
                required: false
                default: "false"
            scope:
                description: "限定 EN 文件路径的正则（如 posts 只翻博客）；留空=全部"
                required: false
                default: ""

permissions:
    contents: write
    pull-requests: write
    issues: write # 翻译失败时由 alert 步骤自动建 issue

# 串行执行：避免同一时间多篇文章发布导致多个工作流并发，互相踩 main。
# cancel-in-progress:false → 后到的发布排队逐个完成（不互相取消、不丢进度、不错乱）。
concurrency:
    group: i18n-translate
    cancel-in-progress: false

env:
    # 发布方式开关：
    #   commit（默认）→ 译文自检通过后直接提交 main，站点自动重建即"正式发布"，CMS 无需二次点击。
    #   pr            → 改为开 PR 待人工合并（保留复核闸门）。
    PUBLISH_MODE: "commit"
    # 翻译总开关：false 时整体暂停（任何 EN 发布都不触发翻译），用于大批量迁移/临时冻结。
    AUTO_TRANSLATE: "true"
    # 目标语言（由 init:i18n 从 Sveltia 配置自动填充，逗号分隔，pelikhan 一次输出全部）
    TARGET_LANGS: "__TARGET_LANGS__"
    CONTENT_ROOT: "__CONTENT_ROOT__"
    I18N_STRUCTURE: "__I18N_STRUCTURE__"
    # 不翻译的集合（force 模式下也不会被送翻；push 模式下已由 paths 排除）。多个逗号分隔。
    SKIP_COLLECTIONS: "__SKIP_COLLECTIONS__"
    # 大站切片：单次翻译最多处理的文件数，超出自动拆成并行分片（避免 6h 超时 / 参数溢出）。
    CHUNK_SIZE: "20"
    # 语言单一来源校验：填 Sveltia 配置文件路径，工作流会校验其 locales 与 TARGET_LANGS 一致；
    # 留空则跳过校验。配置才是"唯一事实来源"，改语言只改这里。
    CONFIG_FILE: "__CONFIG_FILE__"
    # 生成本文件的模板版本（由 init:i18n 填入）。detect 阶段会与 lockfile /
    # package.json 里实际安装的包版本比对，不一致即终止，避免继续跑旧快照。
    TEMPLATE_VERSION: "__TEMPLATE_VERSION__"
    # 暂存目录：必须是【非隐藏】目录且路径中不含两位语言码目录段。
    # pelikhan/action-continuous-translation 会过滤含 /xx/ 语言目录的文件，
    # 而 GenAIScript 的 glob 默认忽略以点开头的隐藏目录（0.3.4 的隐藏暂存目录因此失效）。
    STAGING_DIR: "i18n-staging"
    # translations_dir 只放 usage.jsonl 与 <lang>.json 增量缓存；
    # 真正的译文由 filename_template 写到源文件同目录，故也落在 STAGING_DIR 内。
    TRANSLATIONS_DIR: "i18n-translations"

jobs:
    # ── 阶段 1：检测变更 + 过滤 + 切片（单 job，输出 JSON 分片列表）──
    detect:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        outputs:
            chunks: ${{ steps.detect.outputs.chunks }}
            has_files: ${{ steps.detect.outputs.has_files }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 需要 before/after 两个 SHA 做增量差异

            # (修复 0.3.6) 版本自检必须发生在 CI 里。0.3.5 只在本地 astro dev/build
            # 和 `init:i18n --check` 提示过期，但 Sveltia CMS 直接 push 内容时用户
            # 可能几周都不跑本地构建：包升到 0.3.5、仓库里提交的 workflow 仍是
            # 0.3.4 快照，pelikhan 报 "No files or not matching languages selected."、
            # remap 移动 0 个文件、mkdir .genaiscript/cache 权限失败，而失败 issue
            # 只让人去查 API Key，根因完全不可见。
            # 这里把 lockfile / 已安装包 / package.json 里的版本与模板版本比对，
            # 不一致立即失败并给出可复制的修复命令，不再浪费一次翻译运行。
            - name: Verify i18n template version
              run: |
                  node <<'NODE'
                  const fs = require('fs');
                  const stamped = (process.env.TEMPLATE_VERSION || '').trim();
                  if (!stamped) { console.log('::warning::未找到 TEMPLATE_VERSION，跳过模板版本比对。'); process.exit(0); }
                  console.log('::notice::i18n 模板版本 v' + stamped + '（由 init:i18n 生成）。');

                  // 优先级：lockfile 实际解析的版本 > 已安装包 > package.json 声明。
                  let installed = null, source = null;
                  for (const f of ['pnpm-lock.yaml', 'package-lock.json', 'yarn.lock']) {
                    if (!fs.existsSync(f)) continue;
                    const s = fs.readFileSync(f, 'utf8');
                    const m = s.match(/astro-sveltia-pages@(\d+\.\d+\.\d+(?:-[\w.]+)?)/)
                      || s.match(/astro-sveltia-pages:\s*\n\s*specifier:[^\n]*\n\s*version:\s*(\d+\.\d+\.\d+(?:-[\w.]+)?)/)
                      || s.match(/"node_modules\/astro-sveltia-pages"[\s\S]{0,300}?"version"\s*:\s*"(\d+\.\d+\.\d+(?:-[\w.]+)?)"/);
                    if (m) { installed = m[1]; source = f; break; }
                  }
                  if (!installed) {
                    try {
                      const p = JSON.parse(fs.readFileSync('node_modules/astro-sveltia-pages/package.json', 'utf8'));
                      if (p.version) { installed = p.version; source = 'node_modules/astro-sveltia-pages/package.json'; }
                    } catch (e) { /* dependencies not installed in this job */ }
                  }
                  let declared = null;
                  try {
                    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    declared = (pkg.dependencies || {})['astro-sveltia-pages'] || (pkg.devDependencies || {})['astro-sveltia-pages'] || null;
                  } catch (e) { /* no package.json (e.g. submodule checkout) */ }
                  if (!installed && declared) {
                    const m = String(declared).match(/\d+\.\d+\.\d+(?:-[\w.]+)?/);
                    if (m) { installed = m[0]; source = 'package.json (声明值)'; }
                  }
                  if (!installed) {
                    console.log('::warning::无法解析 astro-sveltia-pages 版本（catalog:/workspace:/未声明），跳过比对。');
                    process.exit(0);
                  }
                  if (installed === stamped) {
                    console.log('✅ 模板与依赖版本一致：' + installed + '（来源 ' + source + '）。');
                    process.exit(0);
                  }
                  // 只拿到 ^0.3.0 这类范围声明时放宽到 major.minor，避免误报。
                  const majorMinor = v => v.split('.').slice(0, 2).join('.');
                  if (source.startsWith('package.json') && /^[~^]/.test(String(declared)) && majorMinor(installed) === majorMinor(stamped)) {
                    console.log('::warning::只能读到版本范围 ' + declared + '，无法精确判定；若翻译异常请重跑 init:i18n。');
                    process.exit(0);
                  }
                  console.error('::error::i18n 工作流模板与已安装的 astro-sveltia-pages 版本不一致，已提前终止本次运行。');
                  console.error('  工作流模板 : v' + stamped);
                  console.error('  已安装版本 : ' + installed + '（来源 ' + source + '）');
                  console.error('  这三份文件是提交进仓库的生成快照，升级依赖不会替换它们。');
                  console.error('  继续用旧 workflow 会导致 pelikhan 报 "No files or not matching languages selected."、');
                  console.error('  remap 移动 0 个文件、随后 mkdir .genaiscript/cache 权限失败，最终零译文。');
                  console.error('  修复    : pnpm exec astro-sveltia-pages init:i18n（并提交更新后的三个文件）');
                  console.error('  CI 拦截 : pnpm exec astro-sveltia-pages init:i18n --check');
                  process.exit(1);
                  NODE

            # 语言单一来源校验：Sveltia 配置的 locales 必须与 TARGET_LANGS 完全一致，
            # 否则直接失败并给出两边差异，防止"只改一边导致静默失效"。
            - name: Validate TARGET_LANGS against Sveltia config
              if: env.CONFIG_FILE != ''
              run: |
                  node <<'NODE'
                  const fs = require('fs');
                  const p = process.env.CONFIG_FILE;
                  if (!p || !fs.existsSync(p)) { console.log('CONFIG_FILE 未设置/不存在，跳过校验'); process.exit(0); }
                  const s = fs.readFileSync(p, 'utf8');
                  const dl = s.match(/default_locale:\s*['"](\w+)['"]/);
                  // 兼容 locales: ["en", "fr"] 与 locales: [{ locale: "en", label: "..." }] 两种写法。
                  // (?:^|[{,\s]) 防止 /locale:/ 误匹配 default_locale 的尾部；
                  // (?<![\w]) 防止误匹配集合里的 initial_locales，同时允许单行内联配置。
                  const localeKeys = [...s.matchAll(/(?:^|[{,\s])locale:\s*['"]([\w-]+)['"]/g)].map(m => m[1]);
                  let locs = localeKeys;
                  if (locs.length === 0) {
                    const block = s.match(/(?<![\w])locales:\s*\[([^\]]*)\]/);
                    if (block) locs = [...block[1].matchAll(/['"]([\w-]+)['"]/g)].map(m => m[1]);
                  }
                  if (!dl || !locs.length) { console.log('未在配置中找到 locales，跳过校验'); process.exit(0); }
                  const target = [...new Set(locs.filter(l => l !== dl[1]))].sort();
                  const want = (process.env.TARGET_LANGS || '').split(',').map(x => x.trim()).filter(Boolean).sort();
                  const a = JSON.stringify(target), b = JSON.stringify(want);
                  if (a !== b) {
                    console.error('❌ 语言列表不一致！');
                    console.error('  Sveltia 配置(' + dl[1] + '): ' + target.join(','));
                    console.error('  TARGET_LANGS        : ' + want.join(','));
                    process.exit(1);
                  }
                  console.log('✅ 语言列表一致: ' + target.join(','));
                  NODE

            # 检测变更 EN 源 → 应用排除规则 → 切片为并行分片
            - name: Detect & split EN sources
              id: detect
              env:
                  AUTO_TRANSLATE: ${{ env.AUTO_TRANSLATE }}
                  CONTENT_ROOT: ${{ env.CONTENT_ROOT }}
                  SKIP_COLLECTIONS: ${{ env.SKIP_COLLECTIONS }}
                  CHUNK_SIZE: ${{ env.CHUNK_SIZE }}
                  FORCE: ${{ github.event.inputs.force }}
                  SCOPE: ${{ github.event.inputs.scope }}
                  GH_EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.event.after }}
              run: |
                  node <<'NODE'
                  const { execSync } = require('child_process');
                  const fs = require('fs');
                  const path = require('path');
                  const sh = c => execSync(c, { encoding: 'utf8' }).trim();
                  const out = process.env.GITHUB_OUTPUT;
                  const write = (k, v) => fs.appendFileSync(out, `${k}=${v}\n`);

                  if ((process.env.AUTO_TRANSLATE || 'true') !== 'true') {
                    console.log('AUTO_TRANSLATE=false，已暂停翻译');
                    write('chunks', '[]'); write('has_files', 'false'); process.exit(0);
                  }

                  const cr = process.env.CONTENT_ROOT;
                  const re = new RegExp('^' + cr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '/.+/en/.+\\.md$');
                  let map;
                  if (process.env.GH_EVENT === 'workflow_dispatch' || process.env.FORCE === 'true') {
                    map = sh(`git ls-files | grep -E "${re.source}"`).split('\n').filter(Boolean);
                  } else {
                    map = sh(`git diff --name-only "${process.env.BEFORE}" "${process.env.AFTER}"`)
                      .split('\n').filter(Boolean).filter(f => re.test(f));
                  }

                  const scope = process.env.SCOPE || '';
                  if (scope) map = map.filter(f => new RegExp(scope).test(f));

                  const skip = (process.env.SKIP_COLLECTIONS || '')
                    .split(',').map(s => s.trim()).filter(Boolean).map(c => new RegExp('/' + c + '/'));

                  const keep = [];
                  for (const f of map) {
                    let s = false;
                    const base = path.basename(f);
                    if (base === '_template.md' || base === 'template.md') s = true;
                    if (/\/(templates|_templates)\//.test(f)) s = true;
                    if (skip.some(rx => rx.test(f))) s = true;
                    if (!s && fs.existsSync(f)) {
                      const h = sh(`head -n 40 "${f}"`);
                      if (/^draft:\s*true\s*$/m.test(h)) s = true;          // 草稿不翻
                      if (/^autoTranslate:\s*false\s*$/m.test(h)) s = true; // 单篇开关
                    }
                    if (s) console.log('跳过（模板/草稿/autoTranslate:false/集合排除）: ' + f);
                    else keep.push(f);
                  }

                  if (keep.length === 0) { write('chunks', '[]'); write('has_files', 'false'); process.exit(0); }

                  const N = parseInt(process.env.CHUNK_SIZE || '20', 10);
                  const chunks = [];
                  for (let i = 0; i < keep.length; i += N) {
                    chunks.push({ i: Math.floor(i / N), files: keep.slice(i, i + N).join(';') });
                  }
                  write('chunks', JSON.stringify(chunks));
                  write('has_files', 'true');
                  console.log('待翻译 ' + keep.length + ' 个文件，分 ' + chunks.length + ' 片');
                  NODE

    # ── 阶段 2：并行翻译分片（matrix 按 detect 输出的分片并发）──
    translate:
        needs: detect
        if: needs.detect.outputs.has_files == 'true'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include: ${{ fromJSON(needs.detect.outputs.chunks) }}
            fail-fast: false # 一个分片失败不影响其余分片（失败由 alert 步骤汇总）
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # (修复 0.3.5) 缓存 pelikhan 真正的增量缓存目录 translations/<lang>.json，
            # 而不是旧模板里那个 root 拥有、且根本没被使用的 .genaiscript/cache。
            - name: Restore translation cache
              uses: actions/cache@v4
              with:
                  path: i18n-translations
                  # (修复 0.3.6) 分片号必须同时出现在 key 与 restore-keys 前缀里。
                  # 旧写法所有分片共享同一个 restore 前缀：并行分片会各自恢复
                  # 同一份旧缓存、再各自保存只含本分片记录的缓存，下一次运行
                  # 只能恢复其中一份，其余分片的增量状态丢失 → 重复翻译。
                  key: i18n-${{ runner.os }}-${{ matrix.i }}-${{ github.run_id }}
                  restore-keys: |
                      i18n-${{ runner.os }}-${{ matrix.i }}-

            # 暂存英文源到"无语言目录、且非隐藏"的扁平路径后再翻译。
            # 原因(pelikhan 兼容性 bug)：pelikhan@v0.2.11 的 translator.genai.mts 里有
            #   .filter(({filename}) => !/\.[a-z]{2,2}(-[a-zA-Z]{2,3})?\.mdx?$/.test(filename))
            #   .filter(({filename}) => !/\/[a-z]{2,2}(-[a-zA-Z]{2,3})?\//.test(filename))
            # 会丢弃路径含 /en/ 或文件名带 .{lang}. 后缀的文件；而 Sveltia multiple_folders
            # 的英文源恰在 .../en/ 下 → "No files or not matching languages selected."。
            # 另外 GenAIScript 的 env.files glob 默认忽略以点开头的隐藏目录，
            # 0.3.4 使用的隐藏暂存目录因此依然取不到文件，0.3.5 改为 i18n-staging。
            #
            # ⚠️ 不要预先把已有译文拷进暂存目录。pelikhan@v0.2.11 从不读取目标译文
            #    Markdown，它的增量完全依赖 translationsDir/<lang>.json 缓存（由上面的
            #    actions/cache 恢复）。预拷旧文件会让下面的"译文完整性"校验把旧文件
            #    误判成本次产出，重新制造"全绿但没翻译"的静默失败。
            - name: Stage EN sources (flatten locale dirs)
              id: stage
              env:
                  CHUNK_FILES: ${{ matrix.files }}
                  CONTENT_ROOT: ${{ env.CONTENT_ROOT }}
                  STAGING_DIR: ${{ env.STAGING_DIR }}
              run: |
                  set -euo pipefail
                  STAGE="$STAGING_DIR"
                  rm -rf "$STAGE"
                  STAGE_FILES=""
                  for f in $(echo "$CHUNK_FILES" | tr ';' '\n'); do
                    [ -z "$f" ] && continue
                    [ -f "$f" ] || { echo "::error::源文件不存在: $f"; exit 1; }
                    rel="${f#"$CONTENT_ROOT"/}"              # {collection}/en/{slug}.md
                    coll="$(dirname "$(dirname "$rel")")"    # {collection}
                    slug="$(basename "${f%.md}")"            # {slug}
                    mkdir -p "$STAGE/$coll"
                    cp "$f" "$STAGE/$coll/$slug.md"
                    STAGE_FILES="${STAGE_FILES:+$STAGE_FILES;}$STAGE/$coll/$slug.md"
                  done
                  [ -n "$STAGE_FILES" ] || { echo "::error::暂存失败，没有可翻译的源文件"; exit 1; }
                  echo "stage_files=$STAGE_FILES" >> "$GITHUB_OUTPUT"
                  # 记录源文件清单，供后续"译文完整性"校验与 remap 使用。
                  echo "$STAGE_FILES" | tr ';' '\n' > "$STAGE/.sources"
                  # 自检：任何暂存路径都不得含两位语言码目录段或 .{lang}. 文件名后缀，
                  # 否则 pelikhan 会静默过滤，必须在进入翻译前就暴露。
                  BAD=$(echo "$STAGE_FILES" | tr ';' '\n' | grep -E '/[a-z]{2}(-[a-zA-Z]{2,3})?/|\.[a-z]{2}(-[a-zA-Z]{2,3})?\.mdx?$' || true)
                  if [ -n "$BAD" ]; then
                    echo "::error::以下暂存路径会被 pelikhan 过滤，请检查集合名/slug: $BAD"
                    exit 1
                  fi
                  echo "暂存完成: $STAGE_FILES"

            # 翻译：复用现成 Action（remark AST 解析，代码块/链接天然保留）。
            # 固定到 v0.2.11，避免浮动 @v0 随上游变更引入回归。
            - name: Translate chunk ${{ matrix.i }}
              uses: pelikhan/action-continuous-translation@v0.2.11
              with:
                  source: en
                  lang: ${{ env.TARGET_LANGS }}
                  files: ${{ steps.stage.outputs.stage_files }}
                  # 显式固定译文命名，避免上游默认值变化导致 remap 找不到文件。
                  # 默认 {{dirname}}/{{basename}}.{{lang}}{{extname}} → 与源文件同目录。
                  filename_template: "{{dirname}}/{{basename}}.{{lang}}{{extname}}"
                  translations_dir: ${{ env.TRANSLATIONS_DIR }}
                  openai_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
                  openai_api_base: https://api.deepseek.com
                  # deepseek-flash 为当前官方模型名（0.3.4 的旧版 flash 别名已退役）。
                  # GenAIScript 模型 id 格式为 provider:model。
                  model_alias: "translation: openai:deepseek-flash"
                  instructions: |
                      仅翻译正文与可翻译字段；
                      严禁翻译：slug、图片/媒体路径、以 http(s):// 开头的外链、代码块与行内代码。
                      严格保留源文档的 Markdown 结构、frontmatter 字段名与 HTML/组件标签，
                      不得改写链接目标、不得增删列表项或重新排版。
                      必须输出完整译文，不得输出摘要、省略或占位文本。
                  glossary_file: i18n/glossary.md

            # (修复 0.3.5) Docker action 以 root 写文件，宿主机 runner（非 root）后续读/写会
            # 触发 "Permission denied"（0.3.4 日志里 mkdir .genaiscript/cache 直接让 job 失败）。
            # 这里把生成物归属权收回，且永不因 chown 失败而中断。
            - name: Reclaim ownership of Docker-generated files
              if: always()
              run: |
                  # 分开执行：任一路径不存在时不能让整条 chown 中断（否则其余目录仍是 root 所有）。
                  for d in "$STAGING_DIR" "$TRANSLATIONS_DIR" .genaiscript; do
                    [ -e "$d" ] && sudo chown -R "$(id -u):$(id -g)" "$d" 2>/dev/null || true
                  done

            # (修复 0.3.5) 显式失败闸门：pelikhan 的 "genaiscript: cancelled" 退出码为 0，
            # 0.3.4 会出现"workflow 全绿、但一篇译文都没有"的静默失败。
            - name: Verify translations were produced
              id: verify
              env:
                  TARGET_LANGS: ${{ env.TARGET_LANGS }}
                  STAGING_DIR: ${{ env.STAGING_DIR }}
              run: |
                  set -euo pipefail
                  STAGE="$STAGING_DIR"
                  [ -f "$STAGE/.sources" ] || { echo "::error::缺少源文件清单 $STAGE/.sources"; exit 1; }
                  MISSING=""
                  TOTAL=0
                  while IFS= read -r src; do
                    [ -z "$src" ] && continue
                    base="${src%.md}"
                    for L in $(echo "$TARGET_LANGS" | tr ',' ' '); do
                      TOTAL=$((TOTAL + 1))
                      # pelikhan 用 lang: to.toLowerCase() 渲染 filename_template，
                      # 因此 zh-CN 的译文文件名是 {slug}.zh-cn.md（全小写）。
                      LL="$(echo "$L" | tr '[:upper:]' '[:lower:]')"
                      [ -s "$base.$LL.md" ] || MISSING="$MISSING $src→$L"
                    done
                  done < "$STAGE/.sources"
                  if [ "$TOTAL" -eq 0 ]; then
                    echo "::error::源文件清单为空，翻译任务未执行。"
                    exit 1
                  fi
                  if [ -n "$MISSING" ]; then
                    echo "::error::译文缺失 $(echo "$MISSING" | wc -w) 项，翻译引擎未产出完整结果。"
                    echo "缺失清单:$MISSING"
                    echo "暂存目录实际内容："
                    find "$STAGE" -type f -printf '  %p (%s bytes)\n' | head -80 || true
                    echo "排查顺序：1) DEEPSEEK_API_KEY 是否有效/余额充足 2) 模型名 3) Actions 日志里是否有 'No files or not matching languages selected.' 4) pelikhan 是否因 markdown 校验失败或内容无变化而跳过写文件"
                    exit 1
                  fi
                  echo "✅ 译文完整：$TOTAL 个 (文件 × 语言) 全部产出。"
                  echo "produced=$TOTAL" >> "$GITHUB_OUTPUT"

            # 路径适配：把暂存译文移回 Sveltia 的 multiple_folders 布局
            # {content_root}/{collection}/{lang}/{slug}.md
            - name: Remap to Sveltia layout
              run: bash scripts/remap-translations.sh "$CONTENT_ROOT" "$STAGING_DIR"

            # 自检 + 提交到共享 batch 分支（带 --force-with-lease 与重试，防并发/手推冲突）
            - name: Self-check & commit to batch branch
              run: |
                  set -euo pipefail
                  BR="i18n/batch-${{ github.run_id }}"
                  git add -A "$CONTENT_ROOT"
                  # 自检：本次落盘的译文若有空文件 → 视为不完整，终止（不写脏数据）
                  EMPTY=$(git diff --cached --name-only "$CONTENT_ROOT" | grep -v '/en/' | while IFS= read -r f; do [ -f "$f" ] && [ ! -s "$f" ] && echo "$f"; done || true)
                  if [ -n "$EMPTY" ]; then echo "::error::存在空译文，终止发布："; echo "$EMPTY"; exit 1; fi
                  if [ -z "$(git diff --cached --name-only "$CONTENT_ROOT")" ]; then
                    echo "⚠️ 译文与已有内容一致（无变更），跳过提交。"
                    exit 0
                  fi
                  git config user.name "i18n-bot"
                  git config user.email "i18n-bot@users.noreply.github.com"
                  git fetch origin "$BR" || true
                  git checkout -B "$BR" "origin/$BR" 2>/dev/null || git checkout -b "$BR"
                  git commit -m "i18n: shard ${{ matrix.i }} (EN → ${{ env.TARGET_LANGS }})"
                  ok=0
                  for n in 1 2 3 4 5; do
                    git fetch origin "$BR" || true
                    if git rebase "origin/$BR" >/dev/null 2>&1 && git push --force-with-lease origin "$BR"; then ok=1; break; fi
                    sleep 4
                  done
                  if [ "$ok" -ne 1 ]; then echo "::error::推送 batch 分支失败"; exit 1; fi

            # (修复 0.3.5) 清理由 root 创建的临时目录；用 sudo 兜底，且不再执行
            # 会触发 Permission denied 的 mkdir。
            - name: Clean staging artifacts
              if: always()
              run: |
                  sudo rm -rf "$STAGING_DIR" .genaiscript 2>/dev/null || rm -rf "$STAGING_DIR" .genaiscript 2>/dev/null || true

            # 调试日志（每分片留存，便于排查未完成的 (locale, file)）
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: translation-logs-${{ github.run_id }}-${{ matrix.i }}
                  path: ${{ env.TRANSLATIONS_DIR }}/
                  if-no-files-found: ignore

    # ── 阶段 3：汇总分片 → 发布（commit 直发 main / pr 待合并）+ 失败告警 ──
    publish:
        needs: [detect, translate]
        if: always() && needs.detect.outputs.has_files == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Collect chunk branches
              id: merge
              run: |
                  set -uo pipefail
                  BR="i18n/batch-${{ github.run_id }}"
                  git fetch origin "$BR" 2>/dev/null || true
                  if git rev-parse --verify "origin/$BR" >/dev/null 2>&1; then
                    git config user.name "i18n-bot"
                    git config user.email "i18n-bot@users.noreply.github.com"
                    git checkout -b "$BR" "origin/$BR"
                    echo "merged=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "merged=false" >> "$GITHUB_OUTPUT"
                  fi

            # (修复 0.3.5) translate 未成功时必须显式失败，否则 publish 会打印
            # "无译文产出"然后整条流水线显示绿色。零译文/零映射已由 translate 内的
            # Verify 与 remap 步骤 exit 1 捕获；translate 成功但 merged=false 属于
            # "译文与已有内容一致、无需提交"的合法增量场景，不能误报失败。
            - name: Fail when translation did not succeed
              if: needs.translate.result != 'success'
              run: |
                  echo "::error::翻译分片未成功完成（translate result: ${{ needs.translate.result }}），没有译文被发布。"
                  echo "请打开 translate 分片的日志，重点看 Verify translations were produced 与 Remap 步骤。"
                  exit 1

            # 发布方式：commit（默认）直接合并到 main 并推送
            - name: Publish to main (commit mode)
              if: steps.merge.outputs.merged == 'true' && env.PUBLISH_MODE == 'commit'
              run: |
                  set -uo pipefail
                  BR="i18n/batch-${{ github.run_id }}"
                  git fetch origin main
                  git checkout main
                  git merge --no-ff "$BR" -m "i18n: auto-translate EN → ${{ env.TARGET_LANGS }}"
                  ok=0
                  for n in 1 2 3 4 5; do
                    git fetch origin main
                    if git rebase origin/main >/dev/null 2>&1 && git push --force-with-lease origin HEAD:main; then ok=1; break; fi
                    sleep 4
                  done
                  git push origin --delete "$BR" || true
                  if [ "$ok" -ne 1 ]; then echo "::error::推送 main 失败"; exit 1; fi

            # 发布方式：pr 开 PR 待人工合并（保留复核闸门）
            - name: Open translation PR (pr mode)
              if: steps.merge.outputs.merged == 'true' && env.PUBLISH_MODE == 'pr'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  base: main
                  branch: i18n/batch-${{ github.run_id }}
                  commit-message: "i18n: auto-translate from EN sources"
                  title: "🌐 i18n: 自动翻译（源语言 EN）"
                  body: |
                      由 Sveltia EN 源变更触发，覆盖目标语言：${{ env.TARGET_LANGS }}。
                      自检已通过，请人工复核机翻质量后合并以正式发布。
                  labels: i18n,automated

            # 失败告警：翻译或发布任一步骤失败 → 自动建 issue，避免"静默失败没人知道"
            - name: Alert on failure (create issue)
              if: failure() || needs.translate.result == 'failure'
              uses: actions/github-script@v7
              with:
                  script: |
                      const result = '${{ needs.translate.result }}';
                      const title = 'i18n-translate failed: run ' + context.runId;
                      const body = [
                        '翻译工作流执行失败（translate: ' + result + '）。',
                        '',
                        'i18n 模板版本: v' + (process.env.TEMPLATE_VERSION || '未知（旧版 workflow，无版本标记）'),
                        '运行链接: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                        '',
                        '排查顺序：',
                        '1. detect 的 Verify i18n template version：模板版本是否与 lockfile / package.json 一致；',
                        '   不一致说明升级依赖后没重跑 init:i18n —— 旧 workflow 会静默产出 0 篇译文，',
                        '   典型症状正是 "No files or not matching languages selected." + "mkdir: Permission denied"。',
                        '   修复：pnpm exec astro-sveltia-pages init:i18n，并提交更新后的三个文件。',
                        '2. translate 分片日志里的 Verify translations were produced（缺失清单会列出 文件→语言）；',
                        '3. DEEPSEEK_API_KEY 是否有效、余额是否充足；',
                        '4. 是否出现 No files or not matching languages selected.（源文件路径/暂存目录问题）。'
                      ].join('\n');
                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title,
                        body,
                        labels: ['i18n', 'ci-failure']
                      });

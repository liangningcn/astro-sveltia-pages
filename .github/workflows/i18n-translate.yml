# .github/workflows/i18n-translate.yml
#
# 版本: 0.3.2 (astro-sveltia-pages)
# 方案: 选项 A —— 复用 pelikhan/action-continuous-translation 作为翻译引擎。
#
# 目标: Sveltia CMS 编辑只维护英文源文件；本工作流在 EN 源变更时，
#       增量翻译为 15 个目标语言，并“自检通过后直接发布到 main”（无需 CMS 二次操作）。
#       通过 env.PUBLISH_MODE 可切换为开 PR 待人工合并。
#
# ── 接入说明 ───────────────────────────────────────────────────────
# 本仓库的 `example/` 已作为内置 dogfood 启用了上述配置，路径即默认值，
# 无需改动即可直接验证。接入你自己的站点时改两处：
# 1) 下方 `on.push.paths` 与 `Detect changed EN sources` 步骤里的
#    `example/src/content/**/en/**` 改成你真实站点的英文源内容路径。
# 2) Sveltia 侧配置（关键）：
#      i18n:
#        structure: multiple_folders   # 或 multiple_files
#        default_locale: en
#        save_all_locales: false       # ← 让 CMS 只提交 en 文件，CI 负责其余语言
#    把 slug / 图片路径等“不可翻译字段”标记为 `i18n: duplicate`，
#    它们会被原样复制、永不被送翻。
#    不触发翻译：单篇在 frontmatter 设 `autoTranslate: false`；
#    全局暂停：把本文件 env.AUTO_TRANSLATE 改为 "false"。
#    存量站引导：已存在的 EN 文件不会自动翻译。到 Actions → i18n-translate → Run workflow，
#    勾选 force 并填 scope（如 posts / products）分批翻译；中断重跑会增量续翻已有译文。
# ───────────────────────────────────────────────────────────────────

name: i18n-translate

on:
    # 只监听英文源文件；译文文件不会再次触发，天然避免回环
    push:
        branches: [main]
        paths:
            - "example/src/content/**/en/**" # ← 改成你的 content 英文源路径
    workflow_dispatch:
        inputs:
            force:
                description: "绕过增量，强制全量翻译（用于存量站批量引导）"
                required: false
                default: "false"
            scope:
                description: "限定 EN 文件路径的正则（如 posts 只翻博客、products 只翻产品）；留空=全部"
                required: false
                default: ""

permissions:
    contents: write
    pull-requests: write
    models: read # 若使用 GitHub Models 免费额度（pelikhan 默认）

# 串行执行：避免同一时间多篇文章发布导致多个翻译 Job 并发打爆翻译 API 限流。
# cancel-in-progress:false → 后到的发布排队逐个完成（不互相取消、不丢进度、不错乱）。
concurrency:
    group: i18n-translate
    cancel-in-progress: false

env:
    # 发布方式开关：
    #   commit（默认）→ 译文自检通过后直接提交 main，站点自动重建即“正式发布”，
    #                    CMS 后台无需任何二次点击；Sveltia 也不需要“发布”按钮。
    #   pr            → 改为开 PR 待人工合并（保留复核闸门，适合对机翻质量强管控的站点）。
    PUBLISH_MODE: "commit"
    # 翻译总开关：false 时整体暂停（任何 EN 发布都不触发翻译），用于大批量迁移/临时冻结。
    AUTO_TRANSLATE: "true"
    # 15 个目标语言（按你的站点调整；逗号分隔，pelikhan 一次输出全部）
    TARGET_LANGS: "fr,de,es,ja,zh,pt,ru,ar,ko,it,nl,pl,tr,vi,th"
    CONTENT_ROOT: "example/src/content" # ← 改成你的 content 根目录
    I18N_STRUCTURE: "multiple_folders" # multiple_folders | multiple_files

jobs:
    translate:
        runs-on: ubuntu-latest
        # 防御：本工作流自提交若误命中 main 也不重跑（PR 模式下实际不会命中）
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 需要 before/after 两个 SHA 做增量差异

            # ── 1) 增量检测：仅取出变更的英文源文件，并过滤掉“不翻译”的条目 ──
            - name: Detect changed EN sources
              id: changes
              run: |
                  # 全局开关：AUTO_TRANSLATE != true 时整体暂停翻译
                  if [ "${AUTO_TRANSLATE:-true}" != "true" ]; then
                    echo "AUTO_TRANSLATE=false，已暂停翻译"
                    echo "files=" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
                    # 强制全量：列出所有英文源（存量站批量引导用）
                    MAP=$(git ls-files | grep -E "^${CONTENT_ROOT}/.+/en/.+\.md$" || true)
                  else
                    # 增量：与本次 push 之前的状态比较
                    MAP=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" \
                          | grep -E "^${CONTENT_ROOT}/.+/en/.+\.md$" || true)
                  fi
                  # 应用 scope 限定（仅 workflow_dispatch 时可指定，留空=不过滤）。
                  # 例：scope=posts 只翻博客；scope=products 只翻产品；分批引导避免单次超时/限流。
                  SCOPE="${{ github.event.inputs.scope }}"
                  if [ -n "$SCOPE" ]; then
                    MAP=$(printf '%s\n' "$MAP" | grep -E "$SCOPE" || true)
                  fi
                  # 单篇开关：frontmatter 含 `autoTranslate: false` 的条目排除（不触发翻译）
                  # 在 CMS 里加一个布尔字段 autoTranslate 即可勾选；默认翻译。
                  KEEP=""
                  for f in $MAP; do
                    if head -n 40 "$f" | grep -q '^autoTranslate:[[:space:]]*false[[:space:]]*$'; then
                      echo "跳过（autoTranslate:false）: $f"
                    else
                      KEEP="$KEEP$f"$'\n'
                    fi
                  done
                  FILES=$(printf '%s' "$KEEP" | sed '/^$/d' | paste -sd ';' -)   # pelikhan 用分号分隔
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
                  echo "待翻译文件: $FILES"

            # ── 2) 翻译：复用现成 Action（remark AST 解析，代码块/链接天然保留）──
            # 默认走 GitHub Models（GITHUB_TOKEN + models:read，有免费额度）。
            # 生产环境 16 语言建议改用 DeepSeek/OpenAI，避免 GitHub Models 限流：
            #   with:
            #     openai_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
            #     openai_api_base: https://api.deepseek.com
            - name: Translate via pelikhan/action-continuous-translation
              if: steps.changes.outputs.files != ''
              uses: pelikhan/action-continuous-translation@v0
              continue-on-error: true # 单语言失败不阻断其余语言
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  source: en
                  lang: ${{ env.TARGET_LANGS }} # 一次输出全部 15 种语言
                  files: ${{ steps.changes.outputs.files }} # 仅处理变更文件
                  # 默认 filename_template 产出 content/{slug}.{lang}.md（紧邻源文件），
                  # 后续由 scripts/remap-translations.sh 映射到 Sveltia 结构。
                  instructions: |
                      仅翻译正文与可翻译字段；
                      严禁翻译：slug、图片/媒体路径、以 http(s):// 开头的外链、代码块与行内代码。
                  glossary_file: i18n/glossary.md # 品牌名/术语白名单（保持不变）
                  # 限流/分片调优（按需打开，缓解 DeepSeek/OpenAI 速率限制）：
                  # max_translation_tokens: 8000   # 单篇超长时分片，单次调用 token 上限
                  # max_validation_tokens: 4000    # 质量自检分片上限
                  # 注：串行锁已保证“跨 run 不并发”；若单 run 内 15 语言仍触发 429，
                  #     调小上方数值或显式指定较慢的模型。

            # ── 3) 路径适配：把 Action 默认输出映射到 Sveltia 的 i18n 文件结构 ──
            # multiple_files 结构（content/{slug}.{lang}.md）可注释掉此步；
            # multiple_folders 结构（content/{lang}/{slug}.md）需要此步。
            - name: Remap to Sveltia layout
              if: env.I18N_STRUCTURE == 'multiple_folders'
              run: bash scripts/remap-translations.sh "$TARGET_LANGS" "$CONTENT_ROOT" "$I18N_STRUCTURE"

            # ── 4) 发布方式（仅在翻译 step 自检通过、outcome==success 时执行）──
            # PUBLISH_MODE=commit（默认）：译文直接 commit 到 main，站点自动重建即“正式发布”，
            #   无需 CMS 二次点击；Sveltia 后台也不再需要“发布”按钮。
            #   （译文文件均非 en 路径，不会再次触发本工作流，天然无回环。）
            - name: Self-check & publish to main (commit mode)
              if: steps.translate.outcome == 'success' && env.PUBLISH_MODE == 'commit'
              run: |
                  # 步骤 3 已完成路径重映射（multiple_folders）。此处仅做发布前自检 + 提交。
                  if [ -z "$(git status --porcelain "$CONTENT_ROOT")" ]; then
                    echo "无译文产出，跳过发布"; exit 0
                  fi
                  # 自检：任意“非英文”译文文件为空 → 视为翻译不完整，终止发布（不写脏数据）
                  EMPTY=$(find "$CONTENT_ROOT" -name '*.md' ! -path '*/en/*' -size 0 2>/dev/null || true)
                  if [ -n "$EMPTY" ]; then
                    echo "存在空译文，终止发布："; echo "$EMPTY"; exit 1
                  fi
                  git config user.name "i18n-bot"
                  git config user.email "i18n-bot@users.noreply.github.com"
                  git add -A "$CONTENT_ROOT"
                  git commit -m "i18n: auto-translate EN → ${{ env.TARGET_LANGS }}"
                  # 串行锁 + rebase 到最新 main，避免与并行合并冲突导致 push 失败
                  git fetch origin main
                  git rebase origin/main
                  git push origin HEAD:main

            # PUBLISH_MODE=pr：改为开 PR 待人工合并（保留复核闸门）
            - name: Open translation PR (pr mode)
              if: steps.translate.outcome == 'success' && env.PUBLISH_MODE == 'pr'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: "i18n: auto-translate from EN sources"
                  branch: i18n/auto-translate
                  title: "🌐 i18n: 自动翻译（源语言 EN）"
                  body: |
                      由 Sveltia EN 源变更触发，覆盖目标语言：${{ env.TARGET_LANGS }}。
                      自检已通过，请人工复核机翻质量后合并以正式发布。
                  labels: i18n,automated
                  add-paths: |
                      ${{ env.CONTENT_ROOT }}/**

            # ── 5) 失败处理 ──
            # • Action 内部已做质量校验 + 增量缓存：某语言 API 报错/返回不完整时，
            #   该文件保持原状（不写脏数据），下一次 EN 变更会增量重试。
            # • 外部 API 限流：用 max_translation_tokens / max_validation_tokens 控制分片；
            #   必要时在翻译 step 包一层重试（官方 retry action）。
            # • 把缓存/失败日志作为 artifact 上传，便于排查未完成的 (locale, file)。
            - name: Upload translation logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: translation-logs
                  path: .genaiscript/cache/

name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type / format check
              run: pnpm run check

            - name: Test
              run: pnpm test

            - name: Template sync gate
              # Rebuild the deployable templates and fail if they drift from the
              # committed artifacts (single source of truth is src/functions).
              run: pnpm run check:templates

            - name: Build package
              run: pnpm run build
